[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-adaptive-crypto-fx-engine"
version = "0.1.0"
description = "Real-time volatility-adaptive crypto and FX execution engine"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "arch",
    "statsmodels",
    "scipy",
    "matplotlib",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
